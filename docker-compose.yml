services:

  postgres:
    image: postgres:17
    container_name: automind-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: automind
      POSTGRES_USER: automind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - automind-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automind -d automind"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  automind-postgres-data: